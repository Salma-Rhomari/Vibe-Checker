<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibe Checker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <h1>Vibe Checker</h1>
    <p class="subtitle">What's your vibe today?</p>

    <div class="moods">
      <button class="mood-btn" data-mood="chill">Chill</button>
      <button class="mood-btn" data-mood="energetic">Energetic</button>
      <button class="mood-btn" data-mood="focus">Focus</button>
      <button class="mood-btn" data-mood="melancholic">Melancholic</button>
    </div>

    <div id="result" class="result hidden">
      <h2 id="result-genre"></h2>
      <p id="result-artist"></p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
